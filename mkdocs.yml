site_name: Accademia degli Incompresi
site_author: Nicholas Cornia
site_url: https://nicholascorniaorpheus.github.io/accademia-degli-incompresi
repo_url: https://github.com/NicholasCorniaOrpheus/accademia-degli-incompresi
nav:
  - Home: index.md
  - Explore: explore.md
  - Contributors: contributors.md
  - Poetry Dataset: poetry.md
  - Music Dataset: music.md

plugins:
  - search

extra_css:
  - assets/css/extras.css

extra_javascript:
  - assets/js/CETEI.js
  - https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js
  - https://d3js.org/d3.v7.min.js 
  - assets/js/kb-init.js


theme:
  name: material
  # custom_dir: overrides
  language: en
  icon:
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
    admonition:
      abstract: fontawesome/solid/book
      note: fontawesome/solid/note-sticky
      quote: fontawesome/solid/quote-left

  font:
      text: Crimson Pro
  palette:
    - scheme: default
      primary: custom
      default: custom
      footer: custom
      accent: amber
      
  features:
    - navigation.prune
    - search.share
    - toc.follow


copyright: Copyright &copy; 2026 Orpheus Instituut, Resounding Libraries

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NicholasCorniaOrpheus
      name: GitHub repository
  social:
    - icon: material/music-note
      link: https://orpheusinstituut.be/en/projects/a-whirlpool-of-imaginary-sounds
      name: A Whirlpool of Imaginary Sounds

markdown_extensions:
  - footnotes
  - tables
  - attr_list
  - admonition
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  # icons extension!
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
