content:
  markdown_content: According to [(Gianfrancesco 2010)](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/PtUvVs5svxr5), Della Porta claimed the invention of the [telescope](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/PN6SZtn33hrf) stating that [Galileo Galilei](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/BQGz5xntAdzr) based his invention from his ninth book _De refractione Optices_.
