content:
  markdown_content: As purely speculative statement, we can image that this madrigal could refer to the singing skills of [Tarquinia Molza](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/oVgX4nooPy2A), related to [Giaches de Wert](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/2YQzcFykWbWq) by a strong feeling of affection.
