content:
  markdown_content: '```

    Il Giuoco delle Virtù, che voi sapete, crebbe tanto che diventò reame; e questo
    carnovale vi si son fattte cose divine, perché ogni settimana sedeva un re, quale
    avea una cena, e ognuno l''avea a presentar d''una stravaganza e d''una composizione,
    che a gara tanto l''uno dell''altro e gli re e i vassalli hanno fatto cose che
    danno che a dire a tutta Roma [...]

    ```

    Letter by [Benedetto Varchi](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/77XzhP5Nbiyg)'
