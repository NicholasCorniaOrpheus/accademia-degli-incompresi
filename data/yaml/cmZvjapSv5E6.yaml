  text:
    - |-
      Mentre pomposa
      Te ne stai Rosa
      Sulla tua verde spina,
      De' vaghi fiori,
      De' grati odori
      Sola tu sei Regina.

      Cedon gl'Acanti,
      E gl'Amaranti,
      E la gentil mortella,
      Rosa polita,
      Rosa gradita,
      Rosa leggiadra, e bella.

      Per te vien fuora
      La lieta aurora
      Perché il color le presti.
      Venere infonde
      Gratie feconde
      Se con l'odor la desti.

      Ma s'una volta
      Tu resti colta
      Da man rapace avara
      Il color fugge
      L'odor si strugge
      Rosa non sei più cara.

      Tu verginetta
      Se ti diletta
      Essermi sempre grata
      Soave intrico
      Laccio pudico
      Dov'ho l'alma legata.

      In questo fiore
      Specchia l'onore
      E tua gentil sembianza;
      Ch'ogni bellezza
      Ogni vaghezza
      VERGINITATE avanza.
