content:
  markdown_content: As purely speculative statement, we can image that this madrigal could refer to the singing skills of [Tarquinia Molza](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/baADqnLF4t7X), related to [Giaches de Wert](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/cBJV9SeGc3Sw) by a strong feeling of affection.
