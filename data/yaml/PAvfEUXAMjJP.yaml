  text:
    - |-
      Io stetti già per creder, che'l popone
      Fussi dinanzi un gran pezzo di via
      A tutte quante l'altre cose buone.

      Massime col salume in compagnia;
      Perché quel dar così perfetto bere,
      M'andava molto per la fantasia.

      E'l cacio con le fave, & con le pere
      Anche hebbe un tempo assai della mia grazia
      Ma de' poponi e non se ne può havere.

      Perché n'è buon di mille un per disgrazia
      E par che costan sempre tanto cari,
      Sol qualche buona borsa se ne sazia.

      Il cacio è cosa più da nostri pari,
      Se non fosse viscoso e poco sano,
      Perché non costa mai molti danari.

      Ma sia del nostro, o sta del parmigiano
      Come tu t'aviluppi seco punto
      Ti fa doler la testa a mano a mano.

      Et poi quei dì che non si mangia l'unto,
      Come son le vigilie comandate,
      Quando egli è necessario appunto, appunto;

      Il parrocchian non vuol, che n'assaggiate
      Ch'è segno pur ch'egli ha in sé qualche pecca,
      Come hanno tutte le cose vietate.

      Ha questo male anchor la carne secca,
      La quaresima tutta intera intera,
      Sabati, & Venerdì, non se ne becca.

      Si che'l popone e'l cacio con la pera
      A mio giudizio & il prosciutto anchora
      Non hanno in sé la somma bontà vera.

      Io cercai ben di lei drento, & di fuora
      Otri, volte spezial, cucine, e letti,
      Et dove la trovai lo vo' dir ora.

      La volta, la cucina i suoi diletti,
      E tutti gli altri spassi della gola
      Han per una virtù, cento difetti.

      Così quel che si fa tra le lenzuola
      Ti riempie, ti sazia, e ti rincresce,
      Come tu'l fai pur una volta sola.

      Alla fin una cosa mi riesce
      Et questa è sola la virtú de' baci,
      Che non iscema mai, ma sempre cresce.

      Questi come i popon non son fallaci,
      Puossene havere a desinare, e a cena,
      Hor vadinsi a impicar presciutti, e caci.

      Forse che ti debilitan la schiena,
      O che ti guastan la complessione,
      Non ci va qui tanto mena & rimena.

      Se tu baciassi il dì cento persone
      Vi ti puoi mantener con poca spesa,
      Et puolo far in dì di passione.

      Perché nol prohibisce mai la chiesa:
      Anzi fin su l'altar ci aspetta il prete,
      Che l'andiam a baciar con la man tesa.

      In tutti i quei paesi ove voi siete,
      In ogni etade in tutte le stagioni,
      Voi potete baciar se vi volete.

      Et non havete a dislacciar calzoni,
      Nuova manifattura stravagante,
      Che chi la ritrovò Dio gliel perdoni.

      Baciansi le parenti tutte quante,
      Perché il bacio in effetto par capace,
      Fin de gli altar, fin delle cose sante.

      Esso fa 'l parentado, esso la pace,
      Esso dell'oprar suo mai non si pente,
      Ben ha perduto il gusto a chi non piace.

      Et se tu truovi chi dica altrimente,
      E vuol preporgli il zucchero, e le torte,
      Digli da parte mia che se ne mente.

      Trovansi baci al mondo di due sorte,
      Parte ne sono asciutti, & parte molli,
      I primi s'usan volentier in corte.

      Se noi vogliam ch'un Prete ci satolli
      Noi dichiamo Signore io ve le bacio,
      Piegate le ginocchia, e torti i colli.

      Venere segue poi quell'altro bacio,
      La qual in ver senza di lui sarebbe
      Come son le lasagne senza cacio.

      Credo ogni valent'huom si straccherebbe
      Che volesse contar le sue maniere,
      Et poi forse anche non le conterebbe.

      Basti accennarvi sol le cose vere,
      Però dico ch'un savio in varie vie
      Vi bacerá le notti intere intere.

      Né bisogna mangiar sei porcherie,
      E riscaldarsi il fegato & le rene,
      Per dirizzare a ciò le fantasie.

      E sempre è netto il vaso, & sempre tiene,
      Et puossi il bacio usar distesso e'n piede,
      Faccia la Luna quando ben le viene.

      Non ha dinanzi il bacio la sua sede
      Più che di drieto, è lecito & concesso
      Di poterci baciar dal capo al piede.

      Non è più proprio all'un, che all'altro sesso,
      Et quel, che fa, patisce in questo caso,
      Et colui ch'è baciato, bacia anch'esso.

      Et perché paia ch'io non parli a caso,
      Dico che'l bacio si può mal'usare
      Dalle persone ch'hanno lungo il naso.

      Ma né per questo gli vo' biasimare
      Perché nel vero non ci han colpa havuto
      Se la Natura gli volse storpiare.

      Ristorinsi costor dunque col fiuto,
      Et con lo intonar bene i contrabbassi;
      E 'l bacio resti a chi non è nasuto.

      Hora io v'ho tocco de' galanti passi
      Senza far troppo lunga diceria,
      Perché così cogl'intendenti fassi;
      Bacio la man di vostra Signoria.
