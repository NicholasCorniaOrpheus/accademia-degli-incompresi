content:
  markdown_content: According to [(Treadwell 2013)](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/VMASYw6gTP7u), the Armani led several costume theatrical performances at the court of [Margherita Gonzaga](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/b3cWxaEm2cLX) taking the role of a female [knight](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/Fgb2i9ph7wYA), imitating the heroines of [Ludovico Ariosto](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/EBMKwsCza3hd)'s [Orlando furioso](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/XU8S5WyvBShC) such as [Bradamante](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/QcHkWZUZDi75).
