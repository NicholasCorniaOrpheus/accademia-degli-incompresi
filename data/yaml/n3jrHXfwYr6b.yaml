content:
  markdown_content: According to [[(Treadwell 2013)]], the Armani led several costume theatrical performances at the court of [[Margherita Gonzaga]] taking the role of a female [knight](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/QD7ZE8NxGr96), imitating the heroines of [Ludovico Ariosto](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/8qMTBqEnmhVL)'s [Orlando furioso](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/FSsfkMyDLbzE) such as [Bradamante](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/7fvcZ2G9nhHD).
