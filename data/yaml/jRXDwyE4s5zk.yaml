  text:
    - |-
      Voi m'havete Signor mandato a dire.
      Che del vostro Gradasso un'opra faccia;
      Io son contento, io vi voglio ubbidire.
        
      Ma s'ella vi riesce una cosaccia,
      La vostra Signoria non se ne rida,
      E pensi ch'a me anche ella dispiaccia.
        
      Egli è nella Poetica del Vida
      Un verso, il qual voi forse anche sapete,
      Che così a gli Autor moderni grida.
        
      Oh tutti quanti voi che componete;
      Non fate cosa mai che vi sia detta,
      Se poco honor haver non ne volete.
        
      Non lavorate a posta mai, né 'n fretta,
      Se già non sete isforzati e constretti
      Da gran maestri e Signori a bacchetta.
        
      Non sono i versi a guisa de farsetti,
      Che si fanno a misura, né la prosa,
      Secondo le persone, hor larghi, hor stretti.
        
      La poesia è come quella cosa,
      Sapete, che bisogna star con lei,
      Che si rizza a sua posta, e leva e posa.
        
      Dunque negarvi versi io non potrei,
      Sendo chi sete, e chi gli negherebbe,
      Anco a Gradasso mio, Re de' Pigmei?
        
      Che giustamente non s'anteporrebbe
      A quel gran Serican, che venne in Francia
      Per la spada d'Orlando, e poi non l’ebbe?
        
      Costui porta altrimenti la sua lancia,
      Non pesarebbe solo il suo pennacchio,
      La stadera dell'Elba, e la bilancia,
        
      Con esso serve per ispaventacchio,
      Anzi ha servito adesso in Alamagna,
      A Turchi, e a Mori, io so quel che mi gracchio.
        
      È destro, snello, adatto di calcagna,
      A far moresche, e salti non è tale,
      Un grillo, un gatto, un cane, e una cagna;
        
      In prima il periglioso, e poi il mortale.
      Non ha tante virtù ne i prati l'herba
      Bettonica, quant'ha quest'animale.
        
      La cera verde sua brusca e acerba,
      Pare un viso di sotto, quando stilla
      Quel che nel ventre smaltito si serba.
        
      La sua genelogia chi potria dilla?
      Io trovo ch'egli uscì d'un di quei buchi
      Dove habitava a Norcia la Sibilla.
        
      Suo padre già faceva gli Eunuchi,
      E lui fe' dottorar nel berrettaio
      Per non tenerlo in frasca come i bruchi.
        
      Nacque nel dua, di qua dal centinaio,
      Et è sì grande, ch'io credo che manchi
      Poca cosa d'un braccio a farli un saio.
        
      Se si trovava colla spada a i fianchi
      Quando i topi assaltaran i ranocchi,
      Egli era fatto condottier de i granchi.
        
      E certo gli somiglia assai ne gli occhi,
      E nella tenerezza della testa,
      Che va incontro alle punte de gli stocchi.
        
      M'è stato detto di non so che festa
      Che voi gli fate, quand'egli è a cavallo.
      Se così tosto a seder non s'appresta.
        
      Fate dall'altra banda traboccallo
      A capo chino, e par che vadi a nozze,
      Sì dolce in quella parte ha fatto il callo.
        
      Così le bestie, non diventon rozze,
      Che vele mena meglio assai, ch'a mano:
      E parte il giuoco fa delle camozze.
        
      Un certo giuoco, ch’i’ ho inteso strano,
      E che si lascia il matto a corna innanzi
      Cader da gli alti scogli in terra al piano.
        
      State cheti Poeti di Romanzi;
      Non mi rompa la testa Rodomonte,
      Né quel Gradasso ch’io dicevo dianzi.
        
      Buovo d'Antona, e Buovo d'Agrismonte,
      E tutti i paladin farebbon meglio
      Poiché sono scartati, andar a monte.
        
      Questo è della montagna il vero Veglio,
      Qesto solo infra tutti pel più grasso,
      E per la meglio roba eleggo, e sceglio.
        
      Più non si dica il Serican Gradasso,
      Questo cognome homai si spegne, e scorcia,
      Come la sera il Sol, quando gli è basso;
        
      Viva Gradasso Berrettai da Norcia.
